<!-- Fixed Navbar Bar (Always stays at top of screen) -->
<header class="fixed top-0 inset-x-0 z-50 bg-white/85 backdrop-blur-md border-b border-slate-200/80 shadow-xs transition-all">
  <nav class="max-w-6xl mx-auto px-6 h-16 md:h-20 flex items-center justify-between">
    
    <!-- Brand / Logo -->
    <a
      routerLink="/"
      (click)="scrollToSection('profile', $event)"
      class="flex items-center gap-2.5 group focus:outline-none cursor-pointer"
    >
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-600/20 group-hover:scale-105 group-hover:bg-indigo-700 transition-all">
        {{ title.charAt(0) }}
      </div>
      <span class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900">
        {{ title }}<span class="text-indigo-600">.</span>
      </span>
    </a>

    <!-- Desktop Navigation Pill Links -->
    <div class="hidden md:flex items-center gap-1 bg-slate-100/80 p-1.5 rounded-full border border-slate-200/60">
      @for (link of links; track link.title) {
        <a
          [href]="'#' + link.sectionId"
          (click)="scrollToSection(link.sectionId, $event)"
          class="px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-200 cursor-pointer"
          [ngClass]="activeSection === link.sectionId
            ? 'bg-white text-indigo-600 shadow-sm'
            : 'text-slate-600 hover:text-indigo-600'"
        >
          {{ link.title }}
        </a>
      }
    </div>

    <!-- Desktop Right Status Pill -->
    <div class="hidden md:flex items-center">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-emerald-700 text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Open to Work</span>
      </div>
    </div>

    <!-- Mobile Hamburger Button -->
    <button
      (click)="toggleMenu()"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="!isMenuHidden"
      class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-xl text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 transition-colors cursor-pointer"
    >
      @if (isMenuHidden) {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      } @else {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      }
    </button>

  </nav>

  <!-- Mobile Dropdown Menu -->
  @if (!isMenuHidden) {
    <div class="md:hidden border-t border-slate-100 bg-white/95 backdrop-blur-md px-6 py-4 shadow-lg">
      <ul class="flex flex-col space-y-1">
        @for (link of links; track link.title) {
          <li>
            <a
              [href]="'#' + link.sectionId"
              (click)="scrollToSection(link.sectionId, $event)"
              class="flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-semibold transition-colors"
              [ngClass]="activeSection === link.sectionId
                ? 'bg-indigo-50 text-indigo-600'
                : 'text-slate-600 hover:bg-slate-50 hover:text-indigo-600'"
            >
              <span>{{ link.title }}</span>
              <span class="text-xs text-slate-400">→</span>
            </a>
          </li>
        }
      </ul>
    </div>
  }
</header>

<!-- Spacer so the fixed navbar doesn't overlap the top of <app-profile> -->
<div class="h-16 md:h-20"></div>
